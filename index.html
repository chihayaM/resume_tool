<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历生成器 Pro</title>
<!-- 页面图标：内联 SVG，不用另存 favicon 文件（# 在 data URI 里要写成 %23） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5be0'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19.5 6H12a2.5 2.5 0 0 0-2.5 2.5v15A2.5 2.5 0 0 0 12 26h8a2.5 2.5 0 0 0 2.5-2.5V11z'/%3E%3Cpath d='M19 6v4.5h5'/%3E%3Cpath d='M13.5 16.5h5M13.5 21h3'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#2f5be0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ===== 设计令牌 =====
   界面自己的配色统一收在这里：品牌蓝 + 中性灰阶，8/10/14 三档圆角。
   简历纸面的配色是另一套（.resume-paper 上的 --hdr-from/--accent 等，跟着主题
   预设走），两套互不干扰 —— 换简历主题不会把界面也染一遍。 */
:root{
  --brand:#2f5be0;--brand-dark:#2347c0;--brand-soft:#eef3ff;--brand-line:#c9d9ff;
  --bg:#f4f6fa;--card:#fff;--text:#1e293b;--text-2:#5b6577;--text-3:#8d97a8;
  --line:#e5e9f1;--line-2:#d3dae6;
  --ok:#0d9b74;--warn:#c97a10;--danger:#d94a4a;
  --r-sm:8px;--r:10px;--r-lg:14px;
  --shadow-1:0 1px 2px rgba(16,24,40,.04);
  --shadow-2:0 8px 24px rgba(16,24,40,.08);
  /* 旧变量名保留：纸面和少量旧样式还在引用 */
  --primary:var(--brand);--primary-dark:var(--brand-dark);--accent:var(--brand);
  --text-light:var(--text-2);--border:var(--line);
}
*{margin:0;padding:0;box-sizing:border-box}
/* ===== 图标 =====
   顶部的 <svg class="svg-sprite"> 里定义了一套 symbol，界面上一律写成
   <svg class="i"><use href="#i-xxx"/></svg>。描边参数放在这里、颜色用
   currentColor，图标就自动跟着文字色走（原来满屏的 emoji 是彩色位图，
   跟界面配色打架，字号不同渲染也不同）。
   注意：这套只用于界面。简历纸面上的图标仍走 JS 里的 ICON_PATHS 内联完整
   <path>，因为 html2canvas 是逐个元素序列化的，引用外部 <use> 的地方导不出图。 */
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
.i{width:16px;height:16px;flex:0 0 auto;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-xl{width:24px;height:24px}
.f-ok{color:var(--ok)}.f-warn{color:var(--warn)}.f-danger{color:var(--danger)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:440px;min-width:440px;background:var(--card);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
/* 页头改成深墨底 + 一抹径向蓝光：比原来的饱和渐变稳，也不会跟右侧
   简历主题（海洋蓝/翡翠绿/星空紫…）撞色 */
.sidebar-header{padding:18px 22px;background:linear-gradient(150deg,#111a2c,#1d3055 58%,#26406e);color:#fff;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.sidebar-header::after{content:'';position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(92,142,255,.5),transparent 68%);pointer-events:none}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#5b8bff,#2f5be0);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 6px 14px rgba(47,91,224,.35);position:relative;z-index:1}
.brand-mark .i{width:19px;height:19px}
.brand-text{position:relative;z-index:1}
.sidebar-header h1{font-size:17px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:7px}
.sidebar-header h1 .pro{font-size:9px;font-weight:700;letter-spacing:1.2px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);color:rgba(255,255,255,.92)}
.sidebar-header p{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.sidebar-body{flex:1;overflow-y:auto;padding:16px 20px 24px}
.sidebar-body::-webkit-scrollbar{width:10px}
.sidebar-body::-webkit-scrollbar-thumb{background:#dde3ec;border:3px solid #fff;border-radius:99px}
.sidebar-body::-webkit-scrollbar-thumb:hover{background:#c6cfdc}
.sidebar-footer{padding:11px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);text-align:center;background:#fcfdfe}
.preview-area{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 18px 48px;overflow-y:auto;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
/* ===== 工具栏 =====
   一排九个按钮、还有两个能一键毁数据的（示例/清空）紧挨着导出，很容易点错。
   现在只留最常用的四个在外面：输出三件套 + 写入文件；其余收进「更多」折叠菜单。 */
/* position/z-index 不能省：工具栏在 DOM 里排在 .resume-paper 前面，
   而纸面是 position:relative，不抬层的话展开的菜单会被纸面盖住。 */
.toolbar{position:relative;z-index:30;display:flex;flex-direction:column;gap:8px;width:100%;max-width:1040px;margin-bottom:12px;padding:9px 6px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.tb-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}
.tb-group{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.tb-spacer{flex:1 1 auto;min-width:6px}
/* 状态文字单独占一行放在按钮上面（原来夹在两组按钮中间，长一点就被挤成省略号，
   还容易被当成按钮的说明）。空着的时候整行消失，工具栏不会空一条。 */
.toolbar .hint{margin:0;padding:0 3px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0}
.toolbar .hint:empty{display:none}
.btn{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .16s;box-shadow:var(--shadow-1);white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:#fbfcfe;color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.btn:active{transform:translateY(0);box-shadow:var(--shadow-1)}
.btn .i{width:15px;height:15px;color:var(--text-3);transition:color .16s}
.btn:hover .i{color:var(--brand)}
.btn-primary{background:linear-gradient(180deg,#3a68ee,#2a52d6);border-color:#2a52d6;color:#fff;box-shadow:0 6px 16px rgba(47,91,224,.28)}
.btn-primary:hover{background:linear-gradient(180deg,#3260e8,#2148c6);border-color:#2148c6;color:#fff}
.btn-primary .i,.btn-primary:hover .i{color:#fff}
/* 有没写回文件的改动时变琥珀色 —— 光看按钮就知道有没有东西没落盘 */
.btn-write.dirty{background:#fff8ec;border-color:#f0cf9a;color:#9a6511}
.btn-write.dirty:hover{background:#fff3e0;border-color:#e0b877}
.btn-write.dirty .i,.btn-write.dirty:hover .i{color:#c9800f}
.btn-write .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:none;margin-left:-2px}
.btn-write.dirty .dot{display:block}
/* 「更多」折叠菜单：低频操作和危险操作都挪进来，避免误点 */
.tb-more{position:relative}
.tb-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:236px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 18px 44px rgba(16,24,40,.18);padding:6px;display:none;z-index:60;text-align:left}
.tb-more.open .tb-menu{display:block}
.tb-more.open .caret{transform:rotate(180deg)}
.caret{width:13px;height:13px;transition:transform .18s}
.tb-menu button,.tb-menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:none;background:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--text-2);font-family:inherit;cursor:pointer;text-align:left;transition:background .14s,color .14s}
.tb-menu button:hover,.tb-menu .mi:hover{background:#f4f7fd;color:var(--text)}
.tb-menu .i{width:15px;height:15px;color:var(--text-3);transition:color .14s}
.tb-menu button:hover .i{color:var(--brand)}
.tb-menu .danger{color:var(--danger)}
.tb-menu .danger:hover{background:#fdf2f2;color:var(--danger)}
.tb-menu .danger .i,.tb-menu .danger:hover .i{color:var(--danger)}
.tb-menu .mi-note{font-size:11px;font-weight:500;color:var(--text-3);margin-left:auto}
/* 菜单里的一行说明（比如当前写入目标是谁） */
.tb-menu .mi-info{font-size:11px;color:var(--text-3);padding:3px 10px 8px;line-height:1.5;word-break:break-all}
.tb-menu hr{border:none;border-top:1px solid var(--line);margin:5px 6px}
.tb-menu .mi input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;margin:0 0 0 auto}
.hint{font-size:12px;color:var(--text-3);margin:0 0 16px;text-align:center;min-height:16px}
/* 侧栏里的几块面板统一成同一种卡片：白底 + 细边 + 一点投影，
   顺序上「简历/头像/配色/版式/模块」是一组，下面才是具体内容字段 */
.panel-title,.theme-panel-title,.section-order-title,.resume-manager-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.panel-title .i,.theme-panel-title .i,.section-order-title .i,.resume-manager-title .i{width:15px;height:15px;color:var(--brand)}
.count{font-size:11px;font-weight:600;color:var(--text-3);background:#f2f5fa;border-radius:6px;padding:1px 6px;letter-spacing:0}
.theme-panel,.section-order,.resume-manager{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow-1)}
.preset-themes{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.preset-btn{width:34px;height:34px;border-radius:9px;border:2px solid rgba(255,255,255,.9);cursor:pointer;transition:all .18s;position:relative;box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(16,24,40,.12);padding:0;display:flex;align-items:center;justify-content:center}
.preset-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 0 1px var(--line-2),0 6px 14px rgba(16,24,40,.16)}
.preset-btn .tick{width:13px;height:13px;color:#fff;opacity:0;stroke-width:3;transition:opacity .18s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.preset-btn.active{box-shadow:0 0 0 1px var(--line),0 0 0 3px var(--brand-soft),0 0 0 4px var(--brand-line)}
.preset-btn.active .tick{opacity:1}
/* 悬停出的色名做成小气泡，别再用 9px 的灰字（基本看不清） */
.preset-btn::after{content:attr(data-label);position:absolute;bottom:-24px;left:50%;transform:translateX(-50%) translateY(-3px);font-size:10px;font-weight:600;color:#fff;background:#1e293b;white-space:nowrap;padding:3px 7px;border-radius:6px;opacity:0;pointer-events:none;transition:all .18s;z-index:5}
.preset-btn:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
.custom-colors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.color-field label{font-size:11px;font-weight:600;color:var(--text-3);display:block;margin-bottom:5px}
.color-field input[type="color"]{width:100%;height:30px;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;cursor:pointer;background:#fff}
.color-field input[type="color"]:hover{border-color:var(--line-2)}
.options-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt-group{min-width:0}
.opt-group.wide{grid-column:1/-1}
.opt-group label{font-size:11px;font-weight:600;color:var(--text-3);display:block;margin-bottom:5px}
.opt-group label .val{color:var(--brand);font-weight:700}
.opt-group select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;font-family:inherit;background:#fbfcfe;color:var(--text);cursor:pointer;transition:all .16s}
.opt-group select:hover{border-color:var(--line-2);background:#fff}
.opt-group select:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.opt-group input[type="range"]{width:100%;padding:0;height:6px;-webkit-appearance:none;background:#e6ebf3;border-radius:3px;border:none;margin-top:9px;cursor:pointer}
.opt-group input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#fff;border:2px solid var(--brand);border-radius:50%;cursor:pointer;box-shadow:0 1px 4px rgba(47,91,224,.35);transition:transform .15s}
.opt-group input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.12)}
.order-list{display:flex;flex-wrap:wrap;gap:6px}
.order-chip{padding:5px 6px 5px 10px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;font-size:12px;font-weight:600;color:var(--text-2);cursor:grab;user-select:none;transition:all .15s;display:flex;align-items:center;gap:5px}
.order-chip:hover{border-color:var(--brand-line);background:#fff;color:var(--brand)}
.order-chip .i{width:13px;height:13px;color:var(--text-3)}
.order-chip:hover .i{color:var(--brand)}
.order-chip:active{cursor:grabbing;background:var(--brand-soft);border-color:var(--brand)}
.order-chip.dragging{opacity:.4}
.order-chip.drag-over{border-color:var(--brand);background:var(--brand-soft);transform:scale(1.05)}
.order-move-btn{background:none;border:none;border-radius:5px;cursor:pointer;padding:2px;color:var(--text-3);transition:all .15s;display:flex;align-items:center}
.order-move-btn .i{width:13px;height:13px}
.order-move-btn:hover{background:var(--brand-soft);color:var(--brand);border:none}
.photo-upload{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.photo-preview{width:58px;height:58px;border-radius:50%;border:2px dashed var(--line-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:#f7f9fc;cursor:pointer;transition:all .18s}
.photo-preview .i{width:22px;height:22px;color:var(--text-3)}
.photo-preview:hover{border-color:var(--brand);background:var(--brand-soft);border-style:solid}
.photo-preview:hover .i{color:var(--brand)}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-info{flex:1;min-width:0}
.photo-info p{font-size:12px;color:var(--text-2);margin-bottom:7px;font-weight:600}
.photo-info button{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:none;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s}
.photo-info button .i{width:13px;height:13px}
.photo-btn-upload{background:var(--brand);color:#fff;margin-right:6px}
.photo-btn-upload:hover{background:var(--brand-dark)}
.photo-btn-upload .i{color:#fff}
.photo-btn-remove{background:#fdf2f2;color:var(--danger)}
.photo-btn-remove:hover{background:#fbe4e4}
/* 每个表单栏目是一张卡片，栏目标题不再用蓝底横线（那是纸面的语言，
   界面里满屏的蓝横线太吵） */
.section{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 16px;box-shadow:var(--shadow-1)}
.section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.section-title .i{width:15px;height:15px;color:var(--brand)}
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13.5px;font-family:inherit;color:var(--text);transition:all .16s;background:#fbfcfe}
.field input::placeholder,.field textarea::placeholder{color:#aab3c2}
.field input:hover,.field textarea:hover{border-color:var(--line-2);background:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
/* resize:none 是配合下面 autoGrow 的自动高度 —— 留着拖拽手柄会和
   自动高度互相打架：你拖大一点，敲一个字就被弹回去 */
.field textarea{resize:none;min-height:70px;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-block{background:#fbfcfe;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 13px;margin-bottom:10px;position:relative;transition:border-color .16s}
.item-block:hover{border-color:var(--line-2)}
.item-block .remove-btn{position:absolute;top:8px;right:8px;background:transparent;color:var(--text-3);border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .16s}
.item-block .remove-btn .i{width:14px;height:14px}
.item-block .remove-btn:hover{background:#fdf2f2;color:var(--danger)}
.add-btn{width:100%;padding:9px;border:1px dashed var(--line-2);border-radius:var(--r);background:transparent;color:var(--text-2);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.add-btn .i{width:14px;height:14px;transition:transform .18s}
.add-btn:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);border-style:solid}
.add-btn:hover .i{transform:rotate(90deg)}
.resume-paper{width:210mm;background:#fff;box-shadow:0 10px 30px rgba(16,24,40,.10),0 1px 3px rgba(16,24,40,.06);padding:0;position:relative;overflow:hidden;flex-shrink:0;--hdr-from:#1e3a5f;--hdr-to:#0ea5e9;--accent:#2563eb;--accent-light:#dbeafe;--accent-border:#bfdbfe;--accent-text:#1e40af}
.resume-header{color:#fff;padding:20px 48px 16px;position:relative;background:linear-gradient(135deg,var(--hdr-from),var(--hdr-to))}
.resume-header::after{content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0}
.resume-header-inner{display:flex;align-items:center;gap:24px}
.resume-avatar{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.4);object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;overflow:hidden}
.resume-avatar img{width:100%;height:100%;object-fit:cover}
.resume-header-text{flex:1}
.resume-name{font-size:36px;font-weight:800;letter-spacing:2px;margin-bottom:2px}
.resume-title{font-size:16px;font-weight:400;opacity:.9;letter-spacing:1px}
/* position/z-index：页头的白色弧形 ::after 是绝对定位，会盖住这一行图标的顶部。
   抬起一层就解决了，比加间距省空间 */
.resume-contact{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;padding:0 48px;font-size:13px;color:#475569;position:relative;z-index:1}
.resume-contact span{display:flex;align-items:center;gap:6px}
/* 16px：这一行的高度是文字行盒（19px）撑的，图标放大不增加行高 */
.resume-contact .ico{width:16px;height:16px;flex:0 0 auto;color:var(--accent-text);overflow:visible}
.resume-body{padding:12px 48px 16px}
.resume-section{margin-bottom:15px}
.resume-section-title{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:2px;padding-bottom:6px;border-bottom:2px solid;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--accent);border-bottom-color:var(--accent)}
.resume-section-title::before{content:'';width:4px;height:18px;border-radius:2px;background:var(--accent)}
/* 点预览里的栏目标题 → 左侧表单滚到对应栏目，见 jumpToFormSection() */
.resume-section-title{cursor:pointer;user-select:none}
.resume-section-title:hover{opacity:.72}
.section-title.flash{animation:secFlash 1.1s ease;border-radius:var(--r-sm)}
@keyframes secFlash{0%,100%{background:transparent}25%{background:var(--brand-soft)}}
/* 反向：鼠标移到左侧编辑区 → 右侧对应栏目标题高亮，见 setPing() */
.resume-section-title.ping{background:#dbeafe;border-radius:4px}
.resume-summary{font-size:14px;line-height:1.5;color:#475569}
.resume-item{margin-bottom:8px}
.resume-item-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.resume-item-title{font-size:15px;font-weight:700;color:#1e293b}
.resume-item-date{font-size:12px;color:#94a3b8;font-weight:600;white-space:nowrap}
.resume-item-sub{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--accent)}
.resume-item-desc{font-size:13px;line-height:1.5;color:#374151}
.resume-item-desc ul{padding-left:18px}
.resume-item-desc li{margin-bottom:0}
.resume-skills{display:flex;flex-wrap:wrap;gap:8px}
.resume-skill-tag{padding:4px 13px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid;background:var(--accent-light);color:var(--accent-text);border-color:var(--accent-border)}
/* 技能分组横排：组名占固定宽度做左列，标签在右列 —— 比原来的上下两行省一半高度 */
.skill-group{display:flex;align-items:flex-start;gap:14px;margin-bottom:5px}
.skill-group:last-child{margin-bottom:0}
.skill-group-name{flex:0 0 86px;font-size:13px;font-weight:700;color:#1e293b;line-height:25px}
.skill-group .resume-skills{flex:1;gap:6px}
.resume-paper.layout-sidebar .resume-body{display:grid;grid-template-columns:200px 1fr;gap:0;padding:0}
.resume-paper.layout-sidebar .resume-sidebar-col{background:#f8fafc;padding:28px 20px;border-right:1px solid #e2e8f0}
.resume-paper.layout-sidebar .resume-main-col{padding:28px 32px}
.resume-paper.layout-sidebar .resume-section-title{font-size:13px;letter-spacing:1.5px}
.resume-paper.layout-sidebar .resume-skill-tag{font-size:11px;padding:4px 10px}
.resume-paper.layout-sidebar .skill-group-name{font-size:11px;flex-basis:66px;line-height:24px}
.resume-paper.layout-sidebar .skill-group{gap:8px;margin-bottom:5px}
.resume-paper.layout-sidebar .resume-skills{gap:5px}
.resume-paper.layout-sidebar .resume-item-header{flex-direction:column;gap:2px}
.resume-paper.layout-sidebar .resume-item-date{font-size:11px}
.resume-paper.layout-sidebar .resume-item-title{font-size:13px}
.resume-paper.layout-sidebar .resume-item-sub{font-size:12px}
.resume-paper.layout-sidebar .resume-item-desc{font-size:12px;line-height:1.6}
.resume-paper.layout-sidebar .resume-contact{padding:0 32px}
/* 多简历管理面板 */
.resume-manager-title{justify-content:space-between}
.resume-manager-title .t{flex:1}
.resume-manager-title button{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;font-family:inherit;padding:5px 10px;border:1px solid var(--brand-line);border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand);cursor:pointer;transition:all .16s}
.resume-manager-title button .i{width:12px;height:12px}
.resume-manager-title button:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.resume-manager-title button:hover .i{color:#fff}
.resume-list{max-height:200px;overflow-y:auto}
.resume-list-item{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;transition:all .15s;margin-bottom:3px;border:1px solid transparent}
.resume-list-item:hover{background:#f6f9ff}
.resume-list-item.active{background:var(--brand-soft);border-color:var(--brand-line)}
.resume-list-item .ri-name{font-size:12.5px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-list-item .ri-date{font-size:11px;color:var(--text-3);margin:0 8px;white-space:nowrap}
.resume-list-item .ri-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s}
.resume-list-item:hover .ri-actions,.resume-list-item.active .ri-actions{opacity:1}
.resume-list-item .ri-actions button{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:var(--text-3);transition:all .15s}
.resume-list-item .ri-actions button .i{width:13px;height:13px}
.resume-list-item .ri-actions button:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.resume-list-item .ri-actions button:hover .i{color:#fff}
.resume-list-item .ri-actions button.ri-del:hover{background:var(--danger);border-color:var(--danger)}
.resume-list-empty{font-size:12px;color:var(--text-3);text-align:center;padding:14px;line-height:1.6}
/* 提示条：原来不管成功失败都是一块黑底，现在按结果上色 + 配图标 */
.toast{position:fixed;bottom:24px;right:24px;display:flex;align-items:center;gap:9px;background:#172033;color:#fff;padding:11px 16px;border-radius:var(--r);font-size:13.5px;font-weight:500;box-shadow:0 12px 32px rgba(16,24,40,.28);z-index:1000;transform:translateY(80px);opacity:0;transition:all .28s cubic-bezier(.2,.8,.3,1);max-width:420px;border:1px solid rgba(255,255,255,.08)}
.toast.show{transform:translateY(0);opacity:1}
.toast .i{width:16px;height:16px}
.toast.ok .i{color:#4ade9b}
.toast.warn .i{color:#f6bf6b}
.loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:999}
.loading-overlay.show{display:flex}
.loading-box{background:#fff;padding:28px 36px;border-radius:var(--r-lg);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.28);font-size:13.5px;font-weight:600;color:var(--text-2)}
.spinner{width:36px;height:36px;border:3px solid #e6ebf3;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
/* 头像裁剪弹层：固定圆形取景框 + 拖动/缩放图片，见 openCropper() */
.crop-overlay{position:fixed;inset:0;background:rgba(15,23,42,.72);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:1001;padding:20px}
.crop-overlay.show{display:flex}
.crop-panel{background:#fff;border-radius:var(--r-lg);padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.4);width:360px;max-width:100%}
.crop-panel h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.crop-tip{font-size:12px;color:var(--text-3);margin-bottom:12px}
.crop-stage{position:relative;width:320px;height:320px;max-width:100%;margin:0 auto;overflow:hidden;border-radius:var(--r);background:#0f172a;cursor:grab;touch-action:none;user-select:none}
.crop-stage.dragging{cursor:grabbing}
.crop-stage img{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}
/* 取景圈用超大 box-shadow 压暗圈外：圈内保持原亮度，比"盖一层半透明蒙版再挖洞"
   更简单，也不会在圆边上留缝 */
.crop-ring{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;box-shadow:0 0 0 9999px rgba(15,23,42,.6);border:2px solid rgba(255,255,255,.9);pointer-events:none}
.crop-zoom{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.crop-zoom span{font-size:12px;color:var(--text-3);white-space:nowrap}
.crop-zoom input[type=range]{flex:1;accent-color:var(--brand)}
.crop-actions{display:flex;gap:10px;margin-top:16px}
.crop-actions button{flex:1;padding:10px;border:1px solid transparent;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s}
.crop-actions .crop-cancel{background:#f4f6fa;color:var(--text-2)}
.crop-actions .crop-cancel:hover{background:#eaeef5;color:var(--text)}
.crop-actions .crop-ok{background:var(--brand);color:#fff}
.crop-actions .crop-ok:hover{background:var(--brand-dark)}
@keyframes toastIn{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
@media print{body{background:#fff}.sidebar,.toolbar,.loading-overlay,.toast,.crop-overlay{display:none!important}.preview-area{padding:0;background-image:none}.resume-paper{box-shadow:none;width:100%}}
@media(max-width:900px){.app{flex-direction:column}.sidebar{width:100%;min-width:unset;height:auto;position:static}.preview-area{padding:16px}.resume-paper{width:100%}.toolbar{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark"><svg class="i"><use href="#i-doc"/></svg></div>
      <div class="brand-text">
        <h1>简历生成器<span class="pro">PRO</span></h1>
        <p>填写信息 → 实时预览 → 一键导出</p>
      </div>
    </div>
    <div class="sidebar-body">
      <!-- 多简历管理面板 -->
      <div class="resume-manager">
        <div class="resume-manager-title">
          <svg class="i"><use href="#i-list"/></svg><span class="t">简历管理</span>
          <button onclick="createNewResume()"><svg class="i"><use href="#i-plus"/></svg>新建简历</button>
        </div>
        <div class="resume-list" id="resumeList"></div>
      </div>
      <div class="photo-upload">
        <div class="photo-preview" id="photoPreview" onclick="$('photoInput').click()"><span class="placeholder"><svg class="i"><use href="#i-camera"/></svg></span></div>
        <div class="photo-info">
          <p>上传头像（可选）</p>
          <button class="photo-btn-upload" onclick="$('photoInput').click()"><svg class="i"><use href="#i-image"/></svg>选择图片</button>
          <button class="photo-btn-remove" onclick="removePhoto()" id="photoRemoveBtn" style="display:none"><svg class="i"><use href="#i-trash"/></svg>移除</button>
          <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(this)">
        </div>
      </div>
      <div class="theme-panel">
        <div class="theme-panel-title"><svg class="i"><use href="#i-swatches"/></svg>主题配色</div>
        <div class="preset-themes">
          <button class="preset-btn active" data-theme='{"from":"#1e3a5f","to":"#0ea5e9","accent":"#2563eb","light":"#dbeafe","border":"#bfdbfe","text":"#1e40af"}' data-label="海洋蓝" onclick="setPreset(this)" style="background:linear-gradient(135deg,#1e3a5f,#0ea5e9)"><svg class="i tick"><use href="#i-check"/></svg></button>
          <button class="preset-btn" data-theme='{"from":"#064e3b","to":"#34d399","accent":"#059669","light":"#d1fae5","border":"#a7f3d0","text":"#065f46"}' data-label="翡翠绿" onclick="setPreset(this)" style="background:linear-gradient(135deg,#064e3b,#34d399)"><svg class="i tick"><use href="#i-check"/></svg></button>
          <button class="preset-btn" data-theme='{"from":"#4c1d95","to":"#a78bfa","accent":"#7c3aed","light":"#ede9fe","border":"#c4b5fd","text":"#5b21b6"}' data-label="星空紫" onclick="setPreset(this)" style="background:linear-gradient(135deg,#4c1d95,#a78bfa)"><svg class="i tick"><use href="#i-check"/></svg></button>
          <button class="preset-btn" data-theme='{"from":"#7c2d12","to":"#fb923c","accent":"#ea580c","light":"#ffedd5","border":"#fed7aa","text":"#9a3412"}' data-label="日落橙" onclick="setPreset(this)" style="background:linear-gradient(135deg,#7c2d12,#fb923c)"><svg class="i tick"><use href="#i-check"/></svg></button>
          <button class="preset-btn" data-theme='{"from":"#881337","to":"#fb7185","accent":"#e11d48","light":"#ffe4e6","border":"#fecdd3","text":"#9f1239"}' data-label="玫瑰红" onclick="setPreset(this)" style="background:linear-gradient(135deg,#881337,#fb7185)"><svg class="i tick"><use href="#i-check"/></svg></button>
          <button class="preset-btn" data-theme='{"from":"#111827","to":"#6b7280","accent":"#374151","light":"#f3f4f6","border":"#d1d5db","text":"#1f2937"}' data-label="商务灰" onclick="setPreset(this)" style="background:linear-gradient(135deg,#111827,#6b7280)"><svg class="i tick"><use href="#i-check"/></svg></button>
          <button class="preset-btn" data-theme='{"from":"#92400e","to":"#fbbf24","accent":"#d97706","light":"#fef3c7","border":"#fde68a","text":"#78350f"}' data-label="琥珀金" onclick="setPreset(this)" style="background:linear-gradient(135deg,#92400e,#fbbf24)"><svg class="i tick"><use href="#i-check"/></svg></button>
          <button class="preset-btn" data-theme='{"from":"#134e4a","to":"#5eead4","accent":"#14b8a6","light":"#ccfbf1","border":"#99f6e4","text":"#115e59"}' data-label="青碧" onclick="setPreset(this)" style="background:linear-gradient(135deg,#134e4a,#5eead4)"><svg class="i tick"><use href="#i-check"/></svg></button>
        </div>
        <div class="custom-colors">

<script>
/* ===== 多简历管理 ===== */
const RESUME_INDEX_KEY='resume_pro_resumes';
const RESUME_PREFIX='resume_pro_resume_';
const MAX_RESUMES=10;
/* 草稿：表单的最近状态。自动读取 resume.json 后 currentResumeId 是 null，
   没有这个键，表单里改的东西一刷新就没了 */
const DRAFT_KEY='resume_pro_draft';
let currentResumeId=null;

function getResumeIndex(){
  try{return JSON.parse(localStorage.getItem(RESUME_INDEX_KEY))||[]}catch(e){return[]}
}
function saveResumeIndex(idx){localStorage.setItem(RESUME_INDEX_KEY,JSON.stringify(idx))}

function genId(){return 'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}

function buildResumeData(){
  return{
    name:val('name'),jobTitle:val('jobTitle'),phone:val('phone'),email:val('email'),
    city:val('city'),website:val('website'),summary:val('summary'),skills:val('skills'),
    exps:state_exps(),edus:state_edus(),projs:state_projs(),customs:state_customs(),
    /* fontSize 必须转成数字：滑块 DOM 的 value 是字符串，直接吐出去会让
       resume.json 里这个字段在 14 和 "14" 之间来回变 */
    theme:currentTheme,sectionOrder:[...sectionOrder],font:val('optFont'),
    fontSize:Number(val('optFontSize'))||14,
    layout:val('optLayout'),photo:photoDataUrl
  };
}

function applyResumeData(d){
  skipRender=true;
  $('name').value=d.name||'';$('jobTitle').value=d.jobTitle||'';
  $('phone').value=d.phone||'';$('email').value=d.email||'';
  $('city').value=d.city||'';$('website').value=d.website||'';
  $('summary').value=d.summary||'';$('skills').value=d.skills||'';
  if(d.theme)currentTheme=d.theme;
  if(d.sectionOrder)sectionOrder=[...d.sectionOrder];
  if(d.font)$('optFont').value=d.font;
  if(d.fontSize)$('optFontSize').value=d.fontSize;
  if(d.layout)$('optLayout').value=d.layout;
  if(d.photo){photoDataUrl=d.photo;$('photoPreview').innerHTML='<img src="'+photoDataUrl+'">';$('photoRemoveBtn').style.display='';persistPhoto(d.photo)}
  else{photoDataUrl='';$('photoPreview').innerHTML=PH_PLACEHOLDER;$('photoRemoveBtn').style.display='none'}
  $('experience-list').innerHTML='';$('education-list').innerHTML='';$('project-list').innerHTML='';$('custom-list').innerHTML='';
  state_exp=[];state_edu=[];state_proj=[];state_custom=[];
  expCount=0;eduCount=0;projCount=0;customCount=0;
  (d.exps||[]).forEach(e=>addExperience(e));
  (d.edus||[]).forEach(e=>addEducation(e));
  (d.projs||[]).forEach(p=>addProject(p));
  (d.customs||[]).forEach(c=>addCustomSection(c));
  skipRender=false;
  applyThemeToInputs();rebuildOrderChips();$('fontSizeVal').textContent=(d.fontSize||14)+'px';
  render();
}

function renderResumeList(){
  const idx=getResumeIndex(),list=$('resumeList');
  if(idx.length===0){list.innerHTML='<div class="resume-list-empty">暂无保存的简历，点击上方按钮新建</div>';return}
  list.innerHTML=idx.map(r=>{
    const active=r.id===currentResumeId?'active':'';
    const dateStr=r.updatedAt?new Date(r.updatedAt).toLocaleDateString('zh-CN'):'';
    return'<div class="resume-list-item '+active+'" onclick="switchResume(\''+r.id+'\')">'
      +'<span class="ri-name">'+esc(r.name||'未命名简历')+'</span>'
      +'<span class="ri-date">'+dateStr+'</span>'
      +'<span class="ri-actions">'
      +'<button onclick="event.stopPropagation();renameResume(\''+r.id+'\')" title="重命名">'+uiIco('pencil')+'</button>'
      +'<button class="ri-del" onclick="event.stopPropagation();deleteResume(\''+r.id+'\')" title="删除">'+uiIco('trash')+'</button>'
      +'</span></div>';
  }).join('');
}

function createNewResume(){
  const idx=getResumeIndex();
  if(idx.length>=MAX_RESUMES){toast('⚠️ 最多保存'+MAX_RESUMES+'份简历');return}
  const id=genId();
  const data=buildResumeData();
  const listName=data.name||'新简历';
  data.name=listName;
  localStorage.setItem(RESUME_PREFIX+id,JSON.stringify(textOnly(data)));
  idx.unshift({id:id,name:listName,createdAt:Date.now(),updatedAt:Date.now()});
  saveResumeIndex(idx);
  currentResumeId=id;
  renderResumeList();
  toast('✅ 新简历已创建');
}

function switchResume(id){
  if(currentResumeId===id)return;
  const raw=localStorage.getItem(RESUME_PREFIX+id);
  if(!raw)return;
  currentResumeId=id;
  applyResumeData(JSON.parse(raw));
  restorePhoto();      /* 记录里已经没有头像了，从 IndexedDB 取回来 */
  renderResumeList();
}

function deleteResume(id){
  if(!confirm('确定删除这份简历？'))return;
  let idx=getResumeIndex();
  idx=idx.filter(r=>r.id!==id);
  saveResumeIndex(idx);
  localStorage.removeItem(RESUME_PREFIX+id);
  if(currentResumeId===id){
    currentResumeId=idx.length>0?idx[0].id:null;
    if(currentResumeId){const raw=localStorage.getItem(RESUME_PREFIX+currentResumeId);if(raw){applyResumeData(JSON.parse(raw));restorePhoto()}}
    else{clearForm();render()}
  }
  renderResumeList();
  toast('✅ 已删除');
}

function renameResume(id){
  const idx=getResumeIndex();
  const item=idx.find(r=>r.id===id);
  if(!item)return;
  const newName=prompt('请输入简历名称：',item.name);
  if(newName===null||newName.trim()==='')return;
  item.name=newName.trim().slice(0,20);
  item.updatedAt=Date.now();
  saveResumeIndex(idx);
  if(id===currentResumeId){
    const raw=localStorage.getItem(RESUME_PREFIX+id);
    if(raw){const d=JSON.parse(raw);d.name=item.name;d.photo='';localStorage.setItem(RESUME_PREFIX+id,JSON.stringify(d))}
  }
  renderResumeList();
  toast('✅ 已重命名');
}

function saveCurrentResume(){
  if(!currentResumeId){createNewResume();return}
  const data=buildResumeData();
  const idx=getResumeIndex();
  const item=idx.find(r=>r.id===currentResumeId);
  if(item){
    item.name=data.name||item.name;
    item.updatedAt=Date.now();
    saveResumeIndex(idx);
  }
  localStorage.setItem(RESUME_PREFIX+currentResumeId,JSON.stringify(textOnly(data)));
  renderResumeList();
  toast('✅ 已保存');
}

function clearForm(){
  $('name').value='';$('jobTitle').value='';$('phone').value='';$('email').value='';
  $('city').value='';$('website').value='';$('summary').value='';$('skills').value='';
  $('experience-list').innerHTML='';$('education-list').innerHTML='';$('project-list').innerHTML='';$('custom-list').innerHTML='';
  state_exp=[];state_edu=[];state_proj=[];state_custom=[];
  expCount=0;eduCount=0;projCount=0;customCount=0;
  sectionOrder=['summary','experience','education','skills','projects'];
  photoDataUrl='';$('photoPreview').innerHTML=PH_PLACEHOLDER;$('photoRemoveBtn').style.display='none';
  currentTheme={from:'#1e3a5f',to:'#0ea5e9',accent:'#2563eb',light:'#dbeafe',border:'#bfdbfe',text:'#1e40af'};
  applyThemeToInputs();rebuildOrderChips();
}

/* 原来第一行是 if(!currentResumeId)return —— 而自动读取 resume.json 之后
   currentResumeId 就是 null，等于表单里的改动一个字都不存。现在无论有没有
   条目都先写一份草稿，currentResumeId 存在时再额外更新那个条目。 */
let autoSaveWarned=false;
function autoSave(){
  const data=buildResumeData();
  persistPhoto(data.photo);                 /* 头像单独进 IndexedDB */
  const s=JSON.stringify(textOnly(data));   /* localStorage 只留纯文本 */
  /* 写 localStorage 一律兜住：万一还是超了配额，setItem 抛的 QuotaExceededError
     会一路冒到 exportPDF 外面，而那个 async 函数的 rejection 没人接 ——
     表现就是「点导出没反应」。这里吞掉并提示一次，保证导出流程照常走。 */
  try{
    localStorage.setItem(DRAFT_KEY,s);
    if(currentResumeId){
      const idx=getResumeIndex();
      const item=idx.find(r=>r.id===currentResumeId);
      if(item){item.name=data.name||item.name;item.updatedAt=Date.now();saveResumeIndex(idx)}
      localStorage.setItem(RESUME_PREFIX+currentResumeId,s);
    }
  }catch(e){
    if(!autoSaveWarned){
      autoSaveWarned=true;
      /* 别只提示「照片太大」——裁剪器输出的头像只有几十 KB，根本撑不爆 5MB，
         真正吃配额的多半是历史遗留的大块数据。把账目列出来，别猜。 */
      const kb=n=>(n/1024).toFixed(1)+' KB';
      const rows=[];let total=0;
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        /* localStorage 按 UTF-16 计费，1 个字符算 2 字节 */
        const sz=((localStorage.getItem(k)||'').length+String(k).length)*2;
        total+=sz;rows.push({'键':k,'占用':kb(sz),'字节':sz});
      }
      rows.sort((a,b)=>b['字节']-a['字节']);
      console.table(rows);
      alert('自动保存失败：'+e.name+'\n'+e.message+'\n\n'
        +'总占用：'+kb(total)+' / 上限约 5120 KB\n'
        +'本次要写：'+kb(JSON.stringify(data).length*2)+'\n\n'
        +'占用最大的几个键：\n'+rows.slice(0,6).map(r=>'· '+r['键']+'  '+r['占用']).join('\n'));
      setTimeout(()=>{autoSaveWarned=false},6000);
    }
  }
  updateWriteBtn();
}

function migrateOldData(){
  const old=localStorage.getItem('resume_pro_data');
  if(!old)return;
  try{
    const d=JSON.parse(old);
    const idx=getResumeIndex();
    if(idx.length>0){localStorage.removeItem('resume_pro_data');return}
    const id=genId();
    const resumeData={
      name:d.name||'我的简历',jobTitle:d.jobTitle||'',phone:d.phone||'',email:d.email||'',
      city:d.city||'',website:d.website||'',summary:d.summary||'',skills:d.skills||'',
      exps:d.exps||[],edus:d.edus||[],projs:d.projs||[],customs:d.customs||[],
      theme:d.theme||currentTheme,sectionOrder:d.sectionOrder||['summary','experience','education','skills','projects'],
      font:d.font||'',fontSize:d.fontSize||14,layout:d.layout||'classic',photo:d.photo||''
    };
    if(resumeData.photo)persistPhoto(resumeData.photo);   /* 老数据里的头像搬进 IndexedDB */
    localStorage.setItem(RESUME_PREFIX+id,JSON.stringify(textOnly(resumeData)));
    idx.push({id:id,name:resumeData.name,createdAt:Date.now(),updatedAt:Date.now()});
    saveResumeIndex(idx);
    currentResumeId=id;
    localStorage.removeItem('resume_pro_data');
  }catch(e){}
}

/* ===== 基础工具 ===== */
let currentTheme={from:'#1e3a5f',to:'#0ea5e9',accent:'#2563eb',light:'#dbeafe',border:'#bfdbfe',text:'#1e40af'};
let sectionOrder=['summary','experience','education','skills','projects'];
let photoDataUrl='';

/* ===== 头像存哪 =====
   localStorage 上限 5MB，而且是按 UTF-16 一个字符算 2 字节计费的；一张原图
   base64 之后就是 3MB 量级，存两三条记录就把配额吃光。配额一满，所有
   setItem 都抛 QuotaExceededError，表现是「改动悄悄不保存、导出按钮没反应」，
   而且报错信息会误导成是照片太大 —— 其实是历史遗留的大图占了坑。
   所以头像一律不进 localStorage：localStorage 只放纯文本（整份简历才几 KB），
   头像单独走 IndexedDB（配额几百 MB）。 */
const PHOTO_IDB_KEY='photo';
let photoSaved=null;      /* 已落盘的头像，用来跳过重复写 */

/* 写 localStorage 前统一过一手，把头像摘掉 */
function textOnly(d){return Object.assign({},d,{photo:''})}

function persistPhoto(p){
  if(p===photoSaved)return;
  photoSaved=p;
  idbSet(PHOTO_IDB_KEY,p||'').catch(()=>{});
}

/* 数据源里没带头像时（草稿和记录都已被摘空）从 IndexedDB 取回来，
   这样只存文字也不影响刷新后头像还在 */
async function restorePhoto(){
  if(photoDataUrl)return;
  try{
    const p=await idbGet(PHOTO_IDB_KEY);
    if(!p)return;
    photoDataUrl=p;photoSaved=p;
    $('photoPreview').innerHTML='<img src="'+p+'">';
    $('photoRemoveBtn').style.display='';
    render();
  }catch(e){}
}

/* 一次性迁移：老版本把原图直接写进了 localStorage，单条记录能到 3.4MB。
   这里逐条把头像摘出来（挑一张存进 IndexedDB 兜底），再原地重写记录。
   重写后的值只会更小，所以即使配额此刻已经爆掉，这次 setItem 也能成功。 */
async function migratePhotosOut(){
  const FLAG='resume_pro_photo_moved_v1';
  if(localStorage.getItem(FLAG))return;
  const keys=[DRAFT_KEY,LAST_IMPORT_KEY,'resume_pro_data'];
  getResumeIndex().forEach(r=>keys.push(RESUME_PREFIX+r.id));
  let keep='';
  for(const k of keys){
    const raw=localStorage.getItem(k);
    if(!raw)continue;
    let d;try{d=JSON.parse(raw)}catch(e){continue}

}

/* 回车自动加 "- " 前缀 */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  const ta=e.target;if(!ta||ta.tagName!=='TEXTAREA')return;
  if(!ta.dataset.f||!['desc','content'].includes(ta.dataset.f))return;
  e.preventDefault();
  const start=ta.selectionStart,end=ta.selectionEnd,val=ta.value;
  const lineStart=val.lastIndexOf('\n',start-1)+1;
  const currentLine=val.substring(lineStart,start);
  /* 如果当前行只有 "- " 或 "- "，回车等于清除该空行 */
  if(currentLine.trim()==='- '||currentLine.trim()==='-'){
    ta.value=val.substring(0,lineStart)+val.substring(end);
    ta.selectionStart=ta.selectionEnd=lineStart;
  }else{
    const insert='\n- ';
    ta.value=val.substring(0,start)+insert+val.substring(end);
    ta.selectionStart=ta.selectionEnd=start+insert.length;
  }
  ta.dispatchEvent(new Event('input'));
});

/* ===== 文本框跟着内容长高 =====

   编辑时得在框里来回滚，看不到上下文。改成内容多高框就多高，一屏看完。 */
function autoGrow(el){
  if(!el||el.tagName!=='TEXTAREA')return;
  /* 先归零再读 scrollHeight，否则读到的是上一次撑开的高度，只会越撑越大 */
  el.style.height='auto';
  /* +2 是给行高的小数部分留余量，不然最后一行偶尔会被顶出一条滚动条 */

}

/* ===== 头像裁剪 =====
   上传后不直接压缩，先弹取景框让用户自己选区域 —— 整张居中裁切时，人脸不在
   正中就废了。取景框做成圆形，跟 .resume-avatar 的显示形状一致（所见即所得）。
   确定后输出 400×400 的 JPEG data URL，压完通常几十 KB，不会撑爆 localStorage
   的 ~5MB 配额（配额一爆，autoSave 的 QuotaExceededError 会让导出按钮静默失效，
   原因见 exportPDF 上方注释）。 */
const PHOTO_OUT=400;      /* 输出边长 */
const CROP_D=240;         /* 取景圈直径，单位是 stage 像素 */
let cropState=null;       /* {img,S,scale,minScale,maxScale,x,y} */

function handlePhoto(input){
  const file=input.files[0];
  input.value='';          /* 立刻清掉，否则再选同一个文件不触发 onchange */
  if(!file)return;
  if(!/^image\//.test(file.type)){toast('⚠️ 请选择图片文件');return}
  const reader=new FileReader();
  reader.onerror=()=>toast('⚠️ 读取文件失败');
  reader.onload=e=>{
    const img=new Image();
    img.onerror=()=>toast('⚠️ 这张图片读不出来，换一张试试');
    img.onload=()=>openCropper(img);
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function openCropper(img){
  const stage=$('cropStage'),el=$('cropImg');
  /* 先显示再量尺寸 —— display:none 的时候 clientWidth 是 0 */
  $('cropOverlay').classList.add('show');
  const S=stage.clientWidth;
  const minScale=CROP_D/Math.min(img.width,img.height);   /* 图片至少要盖满取景圈 */
  cropState={img:img,S:S,scale:minScale,minScale:minScale,maxScale:minScale*4,x:0,y:0};
  el.src=img.src;
  el.style.width=img.width+'px';el.style.height=img.height+'px';
  const z=$('cropZoom');
  z.value=1;                                              /* 滑块 1~4 是相对 minScale 的倍数 */
  z.oninput=function(){if(cropState)setCropScale(cropState.minScale*Number(this.value))};
  centerCrop();
  bindCropDrag();
}

function centerCrop(){
  const st=cropState;
  st.x=(st.S-st.img.width*st.scale)/2;
  st.y=(st.S-st.img.height*st.scale)/2;
  clampCrop();drawCrop();
}

function setCropScale(next){
  const st=cropState;
  next=Math.max(st.minScale,Math.min(st.maxScale,next));
  if(next===st.scale)return;
  /* 以取景圈中心为锚点缩放：让中心点对着的那块原图保持不动 */
  const c=st.S/2;
  const ix=(c-st.x)/st.scale,iy=(c-st.y)/st.scale;
  st.scale=next;
  st.x=c-ix*next;st.y=c-iy*next;
  clampCrop();drawCrop();
}

/* 保证取景圈那一块始终被图片盖满，拖不出白边 */
function clampCrop(){
  const st=cropState,w=st.img.width*st.scale,h=st.img.height*st.scale;
  const lo=st.S/2-CROP_D/2,hi=st.S/2+CROP_D/2;
  st.x=Math.min(lo,Math.max(hi-w,st.x));
  st.y=Math.min(lo,Math.max(hi-h,st.y));
}

function drawCrop(){
  const st=cropState;
  $('cropImg').style.transform='translate('+st.x+'px,'+st.y+'px) scale('+st.scale+')';
}

function bindCropDrag(){
  const stage=$('cropStage');
  if(stage.dataset.bound)return;     /* 只绑一次，之后每次打开复用 */
  stage.dataset.bound='1';
  let dragging=false,px=0,py=0;
  const pt=e=>{const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  stage.addEventListener('pointerdown',e=>{
    if(!cropState)return;
    dragging=true;stage.classList.add('dragging');
    const p=pt(e);px=p.x;py=p.y;
    e.preventDefault();
  });
  window.addEventListener('pointermove',e=>{
    if(!dragging||!cropState)return;
    const p=pt(e);
    cropState.x+=p.x-px;cropState.y+=p.y-py;
    px=p.x;py=p.y;
    clampCrop();drawCrop();
    e.preventDefault();
  });
  window.addEventListener('pointerup',()=>{dragging=false;stage.classList.remove('dragging')});
  stage.addEventListener('wheel',e=>{
    if(!cropState)return;
    e.preventDefault();
    setCropScale(cropState.scale*(e.deltaY<0?1.1:1/1.1));
    $('cropZoom').value=cropState.scale/cropState.minScale;
  },{passive:false});
  /* 点弹层空白处 = 取消，跟点「取消」按钮一致 */
  $('cropOverlay').addEventListener('mousedown',e=>{if(e.target===$('cropOverlay'))closeCropper(false)});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&$('cropOverlay').classList.contains('show'))closeCropper(false);
  });
}

function closeCropper(ok){
  const st=cropState;
  $('cropOverlay').classList.remove('show');
  $('cropStage').classList.remove('dragging');
  $('cropImg').removeAttribute('src');   /* 放掉整张原图，别一直挂在内存里 */
  cropState=null;
  if(!ok||!st)return;
  /* 把取景圈换算回原图坐标，再 1:1 画进输出画布 */
  const s=CROP_D/st.scale;
  const sx=Math.max(0,(st.S/2-CROP_D/2-st.x)/st.scale);
  const sy=Math.max(0,(st.S/2-CROP_D/2-st.y)/st.scale);
  const sw=Math.max(1,Math.min(s,st.img.width-sx,st.img.height-sy));
  const cv=document.createElement('canvas');cv.width=PHOTO_OUT;cv.height=PHOTO_OUT;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,PHOTO_OUT,PHOTO_OUT);   /* 透明 PNG 转 JPEG 会变黑底 */
  ctx.drawImage(st.img,sx,sy,sw,sw,0,0,PHOTO_OUT,PHOTO_OUT);
  photoDataUrl=cv.toDataURL('image/jpeg',0.9);persistPhoto(photoDataUrl);
  $('photoPreview').innerHTML='<img src="'+photoDataUrl+'">';
  $('photoRemoveBtn').style.display='';
  render();autoSave();
}

let dragChip=null;
/* 栏目标题配的小图标（对应 sprite 里的 #i-xxx），自定义栏目统一用小星星 */
const secLabels={summary:'个人简介',experience:'工作经历',education:'教育背景',skills:'专业技能',projects:'项目经验'};
const secIcons={summary:'doc',experience:'briefcase',education:'grad',skills:'wrench',projects:'rocket'};
function getSecLabel(key){
  if(secLabels[key])return secLabels[key];
  if(key.startsWith('custom_')){
    const idx=key.split('_')[1];
    const el=$('custom-'+idx);
    if(el){const t=el.querySelector('[data-f="title"]').value;return t||'自定义栏目'}
  }
  return key;
}

function rebuildOrderChips(){
  const c=$('sectionOrder');c.innerHTML='';
  sectionOrder.forEach((key,i)=>{
    const chip=document.createElement('span');
    chip.className='order-chip';chip.draggable=true;chip.dataset.key=key;
    const label=document.createElement('span');
    label.style.display='flex';label.style.alignItems='center';label.style.gap='5px';
    label.innerHTML=secChipHtml(key);chip.appendChild(label);
    if(i>0){
      const btnUp=document.createElement('button');btnUp.className='order-move-btn';btnUp.innerHTML=uiIco('arrow-up');
      btnUp.title='上移';
      btnUp.onclick=function(e){e.stopPropagation();moveSection(key,-1)};
      chip.appendChild(btnUp);
    }
    if(i<sectionOrder.length-1){
      const btnDown=document.createElement('button');btnDown.className='order-move-btn';btnDown.innerHTML=uiIco('arrow-down');
      btnDown.title='下移';
      btnDown.onclick=function(e){e.stopPropagation();moveSection(key,1)};
      chip.appendChild(btnDown);
    }
    c.appendChild(chip);
  });
  initDrag();
}

function moveSection(key,dir){
  const idx=sectionOrder.indexOf(key);if(idx<0)return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=sectionOrder.length)return;
  sectionOrder.splice(idx,1);sectionOrder.splice(newIdx,0,key);
  rebuildOrderChips();render();scheduleSave();
}

function initDrag(){
  document.querySelectorAll('.order-chip').forEach(chip=>{
    chip.ondragstart=e=>{dragChip=chip;chip.classList.add('dragging');e.dataTransfer.effectAllowed='move'};
    chip.ondragend=()=>{chip.classList.remove('dragging');document.querySelectorAll('.order-chip').forEach(c=>c.classList.remove('drag-over'))};
    chip.ondragover=e=>{e.preventDefault();chip.classList.add('drag-over')};
    chip.ondragleave=()=>chip.classList.remove('drag-over');
    chip.ondrop=e=>{e.preventDefault();chip.classList.remove('drag-over');
      if(dragChip&&dragChip!==chip){
        const fi=sectionOrder.indexOf(dragChip.dataset.key),ti=sectionOrder.indexOf(chip.dataset.key);
        sectionOrder.splice(fi,1);sectionOrder.splice(ti,0,dragChip.dataset.key);
        rebuildOrderChips();render();scheduleSave();
      }
    };
  });
}

/* 按 、,， 切分标签，但括号内的分隔符不切（如「MySQL（增删改查、联表查询）」算一个标签） */
function splitTags(s){
  const out=[];let cur='',depth=0;
  for(const ch of String(s)){
    if('（(【['.indexOf(ch)>-1)depth++;
    else if('）)】]'.indexOf(ch)>-1)depth=Math.max(0,depth-1);
    if(depth===0&&'、,，'.indexOf(ch)>-1){if(cur.trim())out.push(cur.trim());cur=''}
    else cur+=ch;
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}

/* 专业技能：支持「单行逗号分隔」和「多行分组（组名：a、b、c）」两种写法 */
function buildSkillsHtml(raw){
  if(!raw)return '';
  const lines=String(raw).split('\n').map(s=>s.trim()).filter(Boolean);
  const isGrouped=lines.length>1&&lines.every(l=>/[：:]/.test(l));
  const tagHtml=arr=>arr.map(s=>'<span class="resume-skill-tag">'+esc(s)+'</span>').join('');
  let inner;
  if(isGrouped){
    inner=lines.map(l=>{
      const m=l.match(/^(.+?)[：:]\s*(.+)$/);
      if(!m)return '';
      return '<div class="skill-group"><div class="skill-group-name">'+esc(m[1])+'</div><div class="resume-skills">'+tagHtml(splitTags(m[2]))+'</div></div>';
    }).join('');
  }else{
    const tags=tagHtml(splitTags(lines.join(',')));
    inner=tags?'<div class="resume-skills">'+tags+'</div>':'';
  }
  return inner?'<div class="resume-section"><div class="resume-section-title" data-sec="skills">专业技能</div>'+inner+'</div>':'';
}

/* 点预览里的栏目标题 → 左侧表单滚到对应编辑区。
   预览的栏目由 render() 生成，标题上带 data-sec（summary / experience / custom_<i> …），
   与侧栏 .section[data-sec] 一一对应。滚的是 .sidebar-body —— 它才是 overflow-y:auto
   的那个；直接 scrollIntoView 只会让内层跳、外层不动，位置会歪。
   移动端 .sidebar 变静态高度、sidebar-body 不再滚动，那时才退回 scrollIntoView。 */
function jumpToFormSection(key){
  const body=document.querySelector('.sidebar-body');
  if(!body)return;
  let target;
  if(key.indexOf('custom_')===0){
    const blk=$('custom-'+key.slice(7));
    target=blk?blk.closest('.section'):null;
  }else{
    target=document.querySelector('.sidebar-body .section[data-sec="'+key+'"]');
  }
  if(!target)return;

  if(body.scrollHeight>body.clientHeight+1){
    const delta=target.getBoundingClientRect().top-body.getBoundingClientRect().top;
    body.scrollTo({top:Math.max(0,body.scrollTop+delta-12),behavior:'smooth'});
  }else{
    target.scrollIntoView({behavior:'smooth',block:'start'});
  }

  const title=target.querySelector('.section-title');
  if(title){
    title.classList.remove('flash');
    void title.offsetWidth;   /* 强制重排，连点两次也能重放动画 */
    title.classList.add('flash');
    setTimeout(()=>title.classList.remove('flash'),1200);
  }
}
/* 用 document 级委托：预览内容是 render() 反复重建的，绑在 #resume 上会被冲掉 */
document.addEventListener('click',function(e){
  const t=e.target&&e.target.closest?e.target.closest('.resume-section-title[data-sec]'):null;
  if(t)jumpToFormSection(t.dataset.sec);
});

/* 反向：鼠标移到左侧某个编辑区 → 右侧预览里对应的栏目标题高亮。
   工作经历的多个 .item-block 共用预览里的一个「工作经历」，所以按最近的
   .section[data-sec] 找；自定义栏目每个 .item-block 在预览里是独立一节，
   要按 custom-<i> 单独映射。 */
function pickSidebarKey(el){
  const blk=el.closest('.item-block');
  if(blk&&blk.id&&blk.id.indexOf('custom-')===0)return 'custom_'+blk.id.slice(7);
  const sec=el.closest('.section[data-sec]');
  return sec?sec.dataset.sec:null;
}
let pingKey=null;
function setPing(key){
  if(key===pingKey)return;
  if(pingKey){
    const old=$('resume').querySelector('.resume-section-title[data-sec="'+pingKey+'"]');
    if(old)old.classList.remove('ping');
  }
  pingKey=key;
  if(key){
    const el=$('resume').querySelector('.resume-section-title[data-sec="'+key+'"]');
    if(el)el.classList.add('ping');
  }
}
document.addEventListener('mouseover',function(e){
  if(!e.target||!e.target.closest)return;
  setPing(pickSidebarKey(e.target));
});
/* 只有整个离开侧栏时才取消；侧栏内部换区域交给上面的 mouseover 更新 */
document.addEventListener('mouseout',function(e){
  if(!e.target||!e.target.closest||!e.target.closest('.sidebar-body'))return;
  const to=e.relatedTarget;
  if(to&&to.closest&&to.closest('.sidebar-body'))return;
  setPing(null);
});

/* ===== 导出 ===== */
/* 导出倍率。A4 纸宽 210mm ≈ 794 CSS px，乘倍率后铺满 210mm 得到的实际 DPI：
     scale 2 → 192 DPI（原来就是这档，偏软，放大能看出糊）
     scale 3 → 288 DPI（接近印刷标准的 300）
     scale 4 → 384 DPI（更稳，代价是内存和文件大小都往上走）
   PDF 是拿去打印的，用 4；JPG 一般只在屏幕上发人看，3 足够。 */
const PDF_SCALE=4, JPG_SCALE=3;

/* 整个流程都必须在 try 里：原来 render()/autoSave() 在 try 外面，任何一步抛异常
   都会变成 async 函数的未捕获 rejection —— 界面既不弹错也不下载，看着像"没反应"。
   showLoading 提到最前面并放进 finally，这样无论成功失败转圈都会停。 */
async function exportPDF(){
  showLoading(true);
  let el=null,os='';
  try{
    clearTimeout(renderTimer);render();autoSave();
    await new Promise(r=>setTimeout(r,200));
    el=$('resume');os=el.style.boxShadow;el.style.boxShadow='none';
    const canvas=await html2canvas(el,{scale:PDF_SCALE,useCORS:true,logging:false,backgroundColor:'#ffffff'});
    /* 别改成 PNG：jsPDF 不对 PNG 做 Flate 压缩，是把解出来的位图原样写进 PDF。
       3176×4493 的 RGB 原图 ≈ 43MB，加上渐变侧边栏压缩率又低，出来就是 50MB。
       JPEG 确实有损，但到了这个像素密度，噪点相对字高已经小到看不见——
       决定清不清爽的是倍率，不是编码。0.95 是体积和字边缘的平衡点。 */
    const imgData=canvas.toDataURL('image/jpeg',0.95);
    /* 除以 PDF_SCALE 不能省：canvas 尺寸是 CSS 像素乘过倍率的，不除回来
       页面尺寸会跟着倍率一起变大（scale:4 会得到 840mm 宽的纸） */
    const mmW=canvas.width*25.4/96/PDF_SCALE,mmH=canvas.height*25.4/96/PDF_SCALE;
    const Ctor=(window.jspdf&&window.jspdf.jsPDF)||(typeof jsPDF!=='undefined'?jsPDF:null);
    if(!Ctor)throw new Error('jsPDF not loaded');
    const pdf=new Ctor({unit:'mm',format:[mmW,mmH],orientation:mmW>mmH?'landscape':'portrait'});
    pdf.addImage(imgData,'JPEG',0,0,mmW,mmH);
    pdf.save((val('name')||'简历')+'.pdf');
  }catch(e){alert('导出 PDF 失败: '+e.message)}
  finally{
    if(el)el.style.boxShadow=os;
    showLoading(false);
  }
}
async function exportJPG(){
  showLoading(true);
  let el=null,os='';
  try{
    clearTimeout(renderTimer);render();autoSave();
    await new Promise(r=>setTimeout(r,200));
    el=$('resume');os=el.style.boxShadow;el.style.boxShadow='none';
    const canvas=await html2canvas(el,{scale:JPG_SCALE,useCORS:true,logging:false,backgroundColor:'#ffffff'});
    const link=document.createElement('a');link.download=(val('name')||'简历')+'.jpg';link.href=canvas.toDataURL('image/jpeg',0.95);link.click();
  }catch(e){alert('导出失败: '+e.message)}
  finally{
    if(el)el.style.boxShadow=os;
    showLoading(false);
  }
}

function importResumeList(list){
  const idx=getResumeIndex();
  let n=0;
  list.forEach(d=>{
    if(idx.length>=MAX_RESUMES)return;
    const id=genId();
    localStorage.setItem(RESUME_PREFIX+id,JSON.stringify(textOnly(d)));
    idx.unshift({id:id,name:d.name||'导入简历',createdAt:Date.now(),updatedAt:Date.now()});
    n++;
  });
  if(!n){toast('⚠️ 简历数量已达上限 '+MAX_RESUMES);return false}
  saveResumeIndex(idx);
  currentResumeId=idx[0].id;
  applyResumeData(list[0]);
  renderResumeList();
  return true;
}

function flashHint(msg){
  const h=$('jsonHint');
  h.textContent=msg;
  h.title=msg;   /* 长提示在工具栏里会被省略号截掉，悬停看全文 */
  h.style.transition='none';h.style.opacity='1';
}

/* 读取用户选中的 / 拖进来的 JSON 文件 */
function readJsonFile(file){
  if(!file)return;
  if(!/\.json$/i.test(file.name)){toast('⚠️ 请选择 .json 文件');return}
  const r=new FileReader();
  r.onload=e=>{
    try{importJsonData(JSON.parse(e.target.result),file.name)}
    catch(err){alert('JSON 解析失败：'+err.message)}
  };
  r.readAsText(file,'utf-8');
}
function pickJsonFile(){$('jsonInput').click()}
function handleJsonInput(input){readJsonFile(input.files[0]);input.value=''}

/* ===== 写回 resume.json（File System Access API）=====
   浏览器不能凭空写本地文件，但可以让用户授权一次：第一次点「写入」时选一次
   resume.json，句柄存进 IndexedDB，之后每次点都原地写、不再弹框。
   http://127.0.0.1 和 file:// 都算安全上下文，所以两种打开方式都能用；
   Firefox / Safari 没这个 API，自动退回下载。 */
const FS_DB='resume_pro_fs',FS_STORE='handles',FS_KEY='resumeJson';
let fsHandle=null;

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(FS_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(FS_STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
/* 用完就 close：不关的话连接会一直挂着，后面 deleteDatabase() 会被 blocked 住，
   「清除浏览器数据」就删不干净 */
async function idbGet(k){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const q=db.transaction(FS_STORE,'readonly').objectStore(FS_STORE).get(k);
    q.onsuccess=()=>{res(q.result);db.close()};q.onerror=()=>{rej(q.error);db.close()};
  });
}
async function idbSet(k,v){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const q=db.transaction(FS_STORE,'readwrite').objectStore(FS_STORE).put(v,k);
    q.onsuccess=()=>{res();db.close()};q.onerror=()=>{rej(q.error);db.close()};
  });
}
/* 整库删掉（头像和文件句柄都在里面）。
   刚用完的连接可能还没释放完，第一次会被 blocked —— 那不是失败，删不掉才怪，
   隔一拍再删一次；真删不动也不耽误事，浏览器会在连接断开后自己完成。 */
function idbDeleteAll(tried){
  return new Promise(res=>{
    const r=indexedDB.deleteDatabase(FS_DB);
    r.onsuccess=()=>res(true);
    r.onerror=()=>res(false);
    r.onblocked=()=>res(false);
  }).then(ok=>{
    if(ok||tried)return ok;
    return new Promise(r=>setTimeout(r,500)).then(()=>idbDeleteAll(1));
  });
}

function fsWritable(){return typeof window.showSaveFilePicker==='function'}

/* 取回上次记住的写入目标句柄。返回 promise，因为初始化时得等它回来 ——
   启动自动读取要优先读这个文件（见 autoLoadFromHandle） */
function restoreFsHandle(){
  if(!fsWritable())return Promise.resolve(null);
  return idbGet(FS_KEY).then(h=>{
    if(h){fsHandle=h;updateWriteBtn()}
    return h||null;
  }).catch(()=>null);
}

/* 读「写入目标」那个文件。
   走的是文件句柄直接读，不经过 fetch —— 所以在 Pages 上也能用（那边根本没有
   resume.json）。但申请权限必须由用户手势触发，页面刚打开时没有手势，
   所以权限过期的话只能先跳过，提示用户点一次菜单里的「设置写入的 JSON 文件…」。 */
async function autoLoadFromHandle(){
  if(!fsHandle)return false;
  try{
    const p=await fsHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted'){needRegrant=true;return false}
    const txt=await (await fsHandle.getFile()).text();
    diskSnapshot=txt;
    importJsonData(JSON.parse(txt),fsHandle.name);
    return true;
  }catch(e){return false}
}

function updateWriteBtn(){
  const b=$('btnWrite');if(!b)return;
  b.classList.toggle('dirty',!!dirty);   /* 变琥珀 + 亮小圆点，见 .btn-write.dirty */
  const target=fsHandle?fsHandle.name:(fsWritable()?'未选择（首次写入时选一次）':'此浏览器不支持写入');
  b.title=(dirty?'当前有改动还没落盘 · ':'')+'写入目标：'+target;
  /* 菜单里也报一遍当前写到哪个文件 —— 换过文件之后光看按钮是看不出来的 */
  const info=$('writeTargetInfo');
  if(info)info.textContent='写入目标：'+target;
}

/* 取句柄：没有就弹一次选择框；有但权限被浏览器回收就重新申请。
   forcePick=true 时跳过「记住的那个」，直接弹选择框（菜单里的"选择文件并写入"用）。
   注意这条路径上不能先 await 别的东西：showSaveFilePicker 必须在用户手势的
   激活窗口里调用，中途 await 一下就可能被判成非用户触发而报错。 */
async function ensureFsHandle(forcePick){
  if(!forcePick){
    /* 用 1.5s 上限兜住 IndexedDB 的读取，别把激活窗口耗掉 */
    if(!fsHandle){
      try{
        fsHandle=await Promise.race([
          idbGet(FS_KEY),
          new Promise(r=>setTimeout(()=>r(null),1500))
        ]);
      }catch(e){}
    }
    if(fsHandle){
      let p=await fsHandle.queryPermission({mode:'readwrite'});
      if(p!=='granted')p=await fsHandle.requestPermission({mode:'readwrite'});
      if(p==='granted')return fsHandle;
      fsHandle=null;
    }
  }
  const h=await window.showSaveFilePicker({
    suggestedName:'resume.json',
    types:[{description:'JSON 文件',accept:{'application/json':['.json']}}]
  });
  fsHandle=h;idbSet(FS_KEY,h).catch(()=>{});
  return h;
}

/* 只负责「设定」写入目标，不顺手写文件 —— 设好之后，工具条上那个
   「写入 JSON 文件」每次都写到它（句柄存在 IndexedDB，下次打开还记得）。 */
async function setWriteTarget(){
  if(!fsWritable()){toast('⚠️ 此浏览器不支持指定文件，写入会改为下载');return}
  try{
    const h=await ensureFsHandle(true);
    updateWriteBtn();
    toast('✅ 写入目标已设为 '+h.name);
  }catch(e){
    if(e&&e.name==='AbortError'){toast('已取消');return}
    toast('⚠️ 设置失败：'+((e&&e.message)||e));
  }
}

async function writeResumeJson(){
  if(!fsWritable()){toast('⚠️ 此浏览器不支持直接写入，改为下载');exportJson();return}
  /* 句柄必须先拿到：首次会弹系统选择框，而它必须在这次点击的激活窗口里调用，
     所以弹框之前不能先 await 别的东西（比如下面那个读文件比对） */
  let h;
  try{
    h=await ensureFsHandle();
  }catch(e){
    if(e&&e.name==='AbortError'){toast('已取消');return}
    toast('⚠️ 写入失败：'+((e&&e.message)||e));return;
  }
  const data=JSON.stringify(buildResumeData(),null,2);
  /* 磁盘上现在的内容，跟页面加载时读到的是不是同一份？ */
  let stale=false;
  try{
    const disk=await (await h.getFile()).text();
    stale=!!diskSnapshot&&disk.trim()!==diskSnapshot.trim()&&disk.trim()!==data.trim();
  }catch(e){}
  const msg='写入 '+(h.name||'JSON 文件')+'？\n页面里的内容会直接覆盖该文件原有的内容。'
    +(stale?'\n\n⚠️ 该文件的内容和页面加载时不一样（可能被别处改过或写过别的版本），继续会把它覆盖掉。':'');
  if(!confirm(msg)){toast('已取消');return}
  try{
    const w=await h.createWritable();
    await w.write(data);
    await w.close();
    diskSnapshot=data;          /* 刚写的这份就是磁盘现状，别再误报"被改过" */
    dirty=false;updateWriteBtn();
    toast('✅ 已写入 '+h.name);
  }catch(e){
    if(e&&e.name==='AbortError'){toast('已取消');return}
    toast('⚠️ 写入失败：'+((e&&e.message)||e));
  }
}

/* ===== 清除浏览器数据 =====
   localStorage 的键全带 resume_pro 前缀（草稿、简历列表、上次导入、自动读取开关），
   IndexedDB 只有一个 resume_pro_fs（头像 + 写入目标的句柄）。清掉这两样就回到
   第一次打开这个页面的状态 —— 磁盘上的 JSON 文件不动，刷新还能再读回来。 */
const LS_PREFIX='resume_pro';
function clearBrowserData(){
  if(!confirm('清除浏览器里保存的全部数据？\n\n· 正在编辑的草稿\n· 保存到浏览器的简历\n· 头像\n· 写入目标的文件绑定\n· 自动读取开关\n\n磁盘上的 JSON 文件不受影响。清完相当于第一次打开这个页面，且不可撤销。'))return;
  /* 1) localStorage 里带 resume_pro 前缀的全是自家的键，按前缀一起清 */
  Object.keys(localStorage).filter(k=>k.indexOf(LS_PREFIX)===0).forEach(k=>localStorage.removeItem(k));
  /* 2) 先把内存状态和界面复位，别让界面还显示着刚删掉的东西。
        这一步必须同步做完 —— 存储层（IndexedDB）放最后异步处理，
        它慢或者被 blocked 都不该拖住用户看得见的部分。 */
  fsHandle=null;diskSnapshot='';photoDataUrl='';dirty=false;currentResumeId=null;
  clearTimeout(renderTimer);
  $('photoInput').value='';
  clearForm();
  $('optAutoJson').checked=true;   /* 键被删掉后 autoJsonEnabled() 默认返回开，勾选状态要对齐 */
  render();renderResumeList();updateWriteBtn();
  toast('✅ 已清除浏览器数据');
  /* 3) IndexedDB 整库删掉（头像 + 写入目标句柄）。结果不用等，刷新之后一定是干净的 */
  idbDeleteAll().then(()=>flashHint('浏览器数据已清除 —— 刷新页面会重新读取同目录的 JSON 文件'));
}

/* 表单里改了东西却没写回文件时，刷新/关闭前拦一下 */
window.addEventListener('beforeunload',e=>{
  if(dirty){e.preventDefault();e.returnValue=''}
});

/* 自动读取同目录 resume.json。
   只有页面通过 http(s) 打开才读得到；file:// 双击打开会被浏览器 CORS 拦掉，
   这里静默失败，走初始化里的兜底逻辑。 */
/* 页面加载时那份 JSON 的原文快照。写入前拿它跟磁盘上的实际内容比一比，
   能挡住最常见的一种翻车：页面还停在旧内容上，中间文件被别的地方改过了，
   这时候点写入就是把新版盖掉。 */
let diskSnapshot='';
/* 写入目标存在、但权限被浏览器收回时置位：启动时没法申请（要用户手势），只能提示一句 */
let needRegrant=false;

async function autoLoadJson(){
  if(!autoJsonEnabled())return false;
  try{
    const res=await fetch('resume.json',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const txt=await res.text();
    diskSnapshot=txt;
    importJsonData(JSON.parse(txt),'resume.json');
    return true;
  }catch(e){return false}
}

/* 把当前表单导出成 JSON，方便回传修改 */
function exportJson(){
  const data=buildResumeData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(data.name||'简历')+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('✅ 已导出 JSON');
}

/* 把 JSON 文件直接拖到页面上就能载入 */
['dragover','drop'].forEach(function(t){
  document.addEventListener(t,function(e){
    if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length)return;
    e.preventDefault();
    if(t==='drop')readJsonFile(e.dataTransfer.files[0]);
  });
});

/* ===== 初始化 ===== */
(async function init(){
  /* 老版本把原图直接写进了 localStorage，几条记录就把 5MB 配额撑爆 ——
     先搬去 IndexedDB 腾出空间，否则后面每一次写入都会失败。
     必须跑在 migrateOldData 前面：它会把旧的 resume_pro_data 变成一条正式记录，
     顺序反了那张头像就摘不出来了 */
  await migratePhotosOut();
  migrateOldData();
  $('optAutoJson').checked=autoJsonEnabled();
  /* 这里必须等一句：下面要按「写入目标」那个句柄去读文件。
     但别死等 —— IndexedDB 万一不响应，用 800ms 兜住照常往下走 */
  await Promise.race([restoreFsHandle(),new Promise(r=>setTimeout(r,800))]);

  /* 1) 优先读「写入目标」那个文件 —— 句柄直读，Pages 上也能用。
        原来这里只有下面那条 fetch，等于把用户设好的写入目标晾在一边：
        在没有 resume.json 的地方（比如 Pages）那个勾就白勾了。 */
  if(autoJsonEnabled()&&await autoLoadFromHandle()){await restorePhoto();renderResumeList();updateWriteBtn();return}

  /* 2) 没有写入目标（或没权限）就退回读同目录 resume.json（http 打开时可用） */
  if(await autoLoadJson()){await restorePhoto();renderResumeList();updateWriteBtn();return}

  /* 1.5) resume.json 读不到（多半是 file:// 双击打开）就先恢复草稿，
         比下面「上次导入的那份」新，也比空表单强 */
  const draft=localStorage.getItem(DRAFT_KEY);
  if(draft){
    try{
      applyResumeData(JSON.parse(draft));
      await restorePhoto();
      renderResumeList();updateWriteBtn();
      flashHint('已恢复上次的编辑内容（还没写回 JSON 文件）');
      return;
    }catch(e){localStorage.removeItem(DRAFT_KEY)}
  }

  const idx=getResumeIndex();
  if(idx.length>0){
    /* 2) 读上次保存在浏览器里的简历 */
    currentResumeId=idx[0].id;
    const raw=localStorage.getItem(RESUME_PREFIX+currentResumeId);
    if(raw)applyResumeData(JSON.parse(raw));
    else{rebuildOrderChips();render()}
  }else{
    /* 3) 兜底：用上次「导入 JSON」留下的那份 */
    const last=localStorage.getItem(LAST_IMPORT_KEY);
    let ok=false;
    if(last){try{applyResumeData(JSON.parse(last));ok=true}catch(e){}}
    if(!ok){rebuildOrderChips();render()}
  }
  await restorePhoto();
  renderResumeList();
  updateWriteBtn();
  if(needRegrant){
    flashHint('写入目标存在但没读取权限 —— 点「更多 → 设置写入的 JSON 文件…」重新选一次这个文件就能自动读了');
    return;
  }
  if(!autoJsonEnabled())return;
  flashHint('没读到同目录的 JSON —— 点「导入 JSON」载入本地那份，再点「存到浏览器」，之后刷新就不用重导了');
})();
</script>
